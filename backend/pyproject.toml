[project]
name = "secureship"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # httpx2 is not yet published on PyPI — suppress until it ships
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
